<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#000000">
  <title>Mirador - Map Viewer component</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">
  <style>
    html, body, #root { height: 100%; margin: 0; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import { createElement } from 'react';
    import { createRoot } from 'react-dom/client';
    import { MapViewer } from '../src';

    // This is the whole integration surface: a manifest URL (and a language) in, a
    // preconfigured map out. Try `?lang=ar` for the Arabic, right-to-left viewer.
    const lang = new URLSearchParams(window.location.search).get('lang') === 'ar' ? 'ar' : 'en';
    document.documentElement.lang = lang;

    // Nested maps: a Nested Map point's annotation normally carries its linked manifest URL
    // (`dbf:linkedMap.manifestId`, added by the platform's Strapi maps plugin). This static demo
    // map predates it, so its "Old City" point is resolved here instead, to a public IIIF
    // manifest standing in for a map with no published manifest yet.
    const DEMO_NESTED_MAP_MANIFESTS = {
      ak1vrjnvgfygwwqc38hyf9sx: 'https://purl.stanford.edu/hg676jb4964/iiif/manifest',
    };

    createRoot(document.getElementById('root')).render(
      createElement(MapViewer, {
        getLinkedMapManifestId: ({ id }) => DEMO_NESTED_MAP_MANIFESTS[id],
        lang,
        manifestId: 'https://files.tetras-libre.fr/dev/dbf/mapnile.json',
      })
    );
  </script>
</body>

</html>
